services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_DB_PATH: /app/data/machinemitra.db
      PROJECT_DATA_DIR: /app/data
      MODEL_DIR: /app/models
      DATASET_PATH: /app/dataset/ai4i2020.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - app_data:/app/data
      - model_store:/app/models
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    command: sh -c "pip install --no-cache-dir 'mlflow==2.22.0' 'SQLAlchemy>=2.0,<2.1' && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow-data/mlflow.db --serve-artifacts --artifacts-destination /mlflow-artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_db:/mlflow-data
      - mlflow_artifacts:/mlflow-artifacts
    restart: unless-stopped
volumes:
  app_data:
  model_store:
  mlflow_db:
  mlflow_artifacts:
