services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: machinemitra-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: machinemitra-api
    environment:
      APP_DB_PATH: /app/data/machinemitra.db
      PROJECT_DATA_DIR: /app/data
      MODEL_DIR: /app/models
      DATASET_PATH: /app/dataset/ai4i2020.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - app_data:/app/data
      - model_store:/app/models
    expose:
      - "8000"
    depends_on:
      mlflow:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    container_name: machinemitra-mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow-artifacts
    volumes:
      - mlflow_db:/mlflow-data
      - mlflow_artifacts:/mlflow-artifacts
    expose:
      - "5000"
    restart: unless-stopped

volumes:
  app_data:
  model_store:
  mlflow_db:
  mlflow_artifacts:
