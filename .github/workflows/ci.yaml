
services:
  api:
    build: .
    container_name: machinemitra-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
      PROJECT_DATA_DIR: /app/data
      DATASET_PATH: /app/data/raw/ai4i2020.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: machinemitra-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - ./mlflow-data:/mlflow
