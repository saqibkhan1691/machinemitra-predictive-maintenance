@'
name: MachineMitra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: CI Success
        run: echo "MachineMitra CI completed successfully!"
'@ | Set-Content -Path .github/workflows/ci.yaml -Encoding utf8